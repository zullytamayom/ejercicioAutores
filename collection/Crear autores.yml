info:
  name: Crear autores
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8081/api/v1/authors
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "Gabriel",
        "lastName": "Garcia Marquez",
        "email": "ggm@editorial.com",
        "nationality": "Colombian"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
